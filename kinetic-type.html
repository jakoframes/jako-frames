<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0c; --fg:#f4f1ea; --accent:#c6ff3d; --ease:cubic-bezier(.16,1,.3,1); --pop:cubic-bezier(.34,1.56,.64,1); }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden; }
  body {
    display:grid; place-items:center; color:var(--fg);
    font-family:'Anton','Impact','Arial Narrow',sans-serif; text-transform:uppercase;
  }
  .glow {
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, rgba(198,255,61,.08), transparent 55%);
    animation:breathe 3s ease-in-out infinite alternate;
  }
  @keyframes breathe { to { opacity:.4; transform:scale(1.15); } }
  .stage { position:relative; width:100vw; height:100vh; display:grid; place-items:center; }
  .word {
    position:absolute; display:flex; white-space:nowrap; line-height:1;
    font-size:clamp(48px, 15vw, 22vh); letter-spacing:.02em;
  }
  .word.small { font-size:clamp(40px, 11vw, 17vh); }
  .word.accent { color:var(--accent); }
  .ch { display:inline-block; overflow:hidden; padding:0 .01em; }
  .ch > span { display:inline-block; transform:translateY(110%) rotate(8deg); opacity:0; will-change:transform; }
  .sp { width:.28em; }
  .bar {
    position:fixed; left:0; bottom:0; height:3px; width:100%; background:var(--accent);
    transform-origin:left; transform:scaleX(0); animation:prog 6s linear infinite;
  }
  @keyframes prog { to { transform:scaleX(1); } }
  /* states */
  .word.in .ch > span { animation:up .9s var(--pop) forwards; animation-delay:calc(var(--i) * 55ms); }
  .word.out .ch > span { animation:down .55s cubic-bezier(.7,0,.84,0) forwards; animation-delay:calc(var(--i) * 25ms); }
  @keyframes up { from { transform:translateY(110%) rotate(8deg); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes down { from { transform:none; opacity:1; } to { transform:translateY(-110%) rotate(-8deg); opacity:0; } }
  .rule {
    position:absolute; height:4px; width:min(60vw,600px); background:var(--accent); transform:scaleX(0);
    top:calc(50% + 14vh); transition:transform .8s var(--ease);
  }
  .rule.on { transform:scaleX(1); }
  @media (prefers-reduced-motion:reduce) { .glow,.bar { animation:none; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="stage" id="stage"><div class="rule" id="rule"></div></div>
<div class="bar"></div>
<script>
  // Timeline (ms) for a 6000ms loop: each word enters, holds, exits.
  const words = [
    { t:"MOTION",    at:0,    cls:"" },
    { t:"DESIGN",    at:1250, cls:"" },
    { t:"WITH",      at:2500, cls:"small" },
    { t:"AI AGENTS", at:3550, cls:"accent", hold:1900 }
  ];
  const LOOP = 6000, stage = document.getElementById('stage'), rule = document.getElementById('rule');
  const els = words.map(w => {
    const el = document.createElement('div');
    el.className = 'word ' + w.cls;
    el.setAttribute('aria-label', w.t);
    [...w.t].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = c === ' ' ? 'ch sp' : 'ch';
      s.style.setProperty('--i', i);
      s.innerHTML = c === ' ' ? '&nbsp;' : '<span>' + c + '</span>';
      el.appendChild(s);
    });
    stage.appendChild(el);
    return el;
  });
  const timers = [];
  const at = (fn, ms) => timers.push(setTimeout(fn, ms));
  function play() {
    els.forEach(e => e.className = 'word ' + (e.className.match(/small|accent/) || [''])[0]);
    rule.classList.remove('on');
    words.forEach((w, k) => {
      const hold = w.hold || 900;
      const el = els[k];
      at(() => { el.classList.remove('out'); el.classList.add('in'); }, w.at);
      if (k === words.length - 1) at(() => rule.classList.add('on'), w.at + 500);
      at(() => { el.classList.remove('in'); el.classList.add('out'); rule.classList.remove('on'); }, w.at + hold + 450);
    });
    at(play, LOOP);
  }
  // restart progress bar in sync with each loop
  const bar = document.querySelector('.bar');
  (function sync() { bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; setTimeout(sync, LOOP); })();
  document.fonts.ready.then(play);
</script>
</body>
</html>
