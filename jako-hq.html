<title>Jako HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D alpine campus; frosted glass panels float at the corners like trail signs */
:root {
  --ink: #18202f;
  --muted: #566176;
  --glass: rgba(255, 255, 255, 0.80);
  --glass-strong: rgba(255, 255, 255, 0.93);
  --limestone: #efe9df;
  --display: 'Unbounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: #dfe6e8; color: var(--ink); font-family: var(--body); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }

.tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  white-space: nowrap; transition: opacity .25s;
}
.tag b {
  font: 700 11px/1 var(--mono); color: #fff; background: var(--c);
  padding: 5px 8px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.tag span {
  font: 700 11px/1.2 var(--body); color: var(--ink); background: var(--glass-strong);
  padding: 4px 8px; border-radius: 8px; transition: transform .3s;
}
.tag.far span { display: none; }
.tag.pop span { transform: scale(1.12); }

.ui {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255,255,255,.7); border-radius: 18px; box-shadow: 0 8px 30px rgba(24,32,47,.12); }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.top > * { pointer-events: auto; }
.brand { padding: 14px 18px; display: grid; gap: 4px; min-width: 0; }
.brand h1 { margin: 0; font: 800 22px/1.05 var(--display); letter-spacing: -0.01em; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; }
.brand small { font: 500 10.5px/1.3 var(--mono); color: var(--muted); letter-spacing: .02em; }

.bars { display: grid; gap: 8px; justify-items: end; }
.controls { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; padding: 5px; }
.btn {
  font: 800 13px/1 var(--body); color: var(--ink); background: transparent; border: 0;
  padding: 10px 13px; border-radius: 12px; cursor: pointer;
}
.btn:hover { background: rgba(24,32,47,.07); }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.btn:focus-visible, .chip:focus-visible, .copy:focus-visible, .close:focus-visible, .task:focus-visible { outline: 3px solid #3d8bff; outline-offset: 2px; }

.bottom { display: grid; gap: 10px; justify-items: end; }
.bottom > * { pointer-events: auto; }

.card { width: min(380px, 100%); padding: 16px 18px; display: grid; gap: 10px; background: var(--glass-strong); box-sizing: border-box; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); flex: none; }
.card-head div { min-width: 0; flex: 1; }
.card-head strong { display: block; font: 700 15px/1.2 var(--mono); }
.card-head em { font-style: normal; font-size: 12.5px; color: var(--muted); font-weight: 800; }
.close { border: 0; background: rgba(24,32,47,.07); width: 30px; height: 30px; border-radius: 50%; font: 800 16px/1 var(--body); color: var(--ink); cursor: pointer; flex: none; }
.card p { margin: 0; font-size: 14px; line-height: 1.45; }
.card .now { font-size: 13px; font-weight: 800; color: var(--ink); background: var(--limestone); padding: 7px 10px; border-radius: 10px; }
.card label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ask { display: flex; gap: 8px; align-items: stretch; }
.ask code { flex: 1; min-width: 0; font: 500 12px/1.45 var(--mono); background: var(--limestone); padding: 9px 10px; border-radius: 10px; overflow-wrap: anywhere; }
.copy { border: 0; border-radius: 10px; padding: 0 12px; font: 800 12px/1 var(--body); background: var(--ink); color: #fff; cursor: pointer; }
.task { border: 0; border-radius: 12px; padding: 11px 14px; font: 800 13px/1 var(--body); background: var(--c); color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.task:disabled { background: #d9d6cf; color: var(--muted); text-shadow: none; cursor: default; }
.card .note { font-size: 12px; color: var(--muted); line-height: 1.4; }

.roster-wrap { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 12px; font-weight: 800; color: var(--ink); background: var(--glass); padding: 8px 12px; border-radius: 999px; }
.roster { display: flex; gap: 6px; padding: 6px; overflow-x: auto; max-width: 100%; box-sizing: border-box; scrollbar-width: none; }
.chip {
  display: flex; align-items: center; gap: 8px; border: 0; background: transparent; cursor: pointer;
  padding: 8px 12px 8px 9px; border-radius: 12px; color: var(--ink); text-align: left; flex: none;
}
.chip:hover { background: rgba(24,32,47,.06); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, white); }
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
.chip b { display: block; font: 700 12px/1.2 var(--mono); }
.chip small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }

.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }

@media (max-width: 720px) {
  .brand h1 { font-size: 18px; }
  .brand small { display: none; }
  .bars { justify-items: start; }
  .btn { padding: 8px 9px; font-size: 12px; }
  .tag span { display: none; }
  .hint { display: none; }
  .chip small { display: none; }
  .bottom { justify-items: stretch; }
  .card { width: 100%; }
}
</style>

<canvas id="scene" aria-label="3D alpine campus below Sassolungo: an open-air office, sports courts and a lounge where five small agents work and play"></canvas>
<div class="tags" id="tags"></div>

<div class="ui">
  <div class="top">
    <header class="brand glass">
      <h1>Jako HQ</h1>
      <p>The Dolomites · 5 agents, 5 teams</p>
      <small>Alpe di Siusi · Sassolungo 3,181 m · 46.54° N 11.63° E</small>
    </header>
    <div class="bars">
      <nav class="controls glass" aria-label="Camera">
        <button class="btn" id="vOverview" aria-pressed="true">Overview</button>
        <button class="btn" id="vOffice" aria-pressed="false">Office</button>
        <button class="btn" id="vCourts" aria-pressed="false">Courts</button>
        <button class="btn" id="vLounge" aria-pressed="false">Lounge</button>
      </nav>
      <nav class="controls glass" aria-label="Scene">
        <button class="btn" id="work" aria-pressed="false">Everyone to work</button>
        <button class="btn" id="dusk" aria-pressed="false">Alpenglow</button>
        <button class="btn" id="spin" aria-pressed="false">Auto-rotate</button>
      </nav>
    </div>
  </div>

  <div class="bottom">
    <section class="card glass" id="card" hidden aria-live="polite">
      <div class="card-head">
        <span class="card-dot" id="cDot"></span>
        <div><strong id="cName"></strong><em id="cTeam"></em></div>
        <button class="close" id="cClose" aria-label="Close">×</button>
      </div>
      <p class="now" id="cNow"></p>
      <p id="cRole"></p>
      <button class="task" id="cTask">Assign a task</button>
      <p class="note">Sends this agent to its desk for 30 seconds. In real use this happens when you call the agent.</p>
      <label for="cAsk">How to call this agent</label>
      <div class="ask"><code id="cAsk"></code><button class="copy" id="cCopy">Copy</button></div>
    </section>
    <div class="roster-wrap">
      <span class="hint">Drag to orbit · Scroll to zoom · Click an agent to follow it</span>
      <div class="roster glass" id="roster" role="group" aria-label="Agents"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
'use strict';

const AGENTS = [
  { id: 'analyst', team: 'Analytics team', color: '#3D8BFF', screen: 'chart', monitor: true,
    role: 'Pulls results from Metricool and explains in plain words why each post did or did not work.',
    ask: 'Use the analyst agent to break down the stats for the latest reel',
    status: ['Pulling data from Metricool…', 'Calculating view rate', 'Writing the weekly report', 'Comparing avg watch time'] },
  { id: 'caption-writer', team: 'Copy team', color: '#FF8A3D', screen: 'text',
    role: 'Writes captions, first-second hooks, hashtags and calls to action. Drafts only and never publishes.',
    ask: "Use the caption-writer agent to write 3 hooks and a caption for today's post",
    status: ['Drafting hook options…', 'Tightening the caption', 'Picking hashtags', 'Working on the CTA'] },
  { id: 'planner', team: 'Planning team', color: '#F2B90F', screen: 'calendar',
    role: 'Keeps the 30-day plan on track: what goes out today, what is running late and what should move.',
    ask: 'Use the planner agent: what are we posting today?',
    status: ["Checking today's post…", 'Updating the 30-day plan', 'Tracking deadlines', 'Prepping for Oct 26'] },
  { id: 'video-director', team: 'Video team', color: '#9B5CFF', screen: 'timeline', monitor: true,
    role: 'Storyboards, animation, subtitles, sound effects and renders. Shows the plan first, then builds.',
    ask: "Use the video-director agent to storyboard tomorrow's reel",
    status: ['Sketching the storyboard…', 'Rendering frames', 'Adding sound effects', 'Checking the 9:16 frame'] },
  { id: 'trend-scout', team: 'Research team', color: '#2FBF66', screen: 'grid',
    role: 'Researches Reels trends, trending audio and similar accounts, and brings back ideas for Jako.',
    ask: "Use the trend-scout agent to find this week's motion design trends",
    status: ['Scanning Reels trends…', 'Finding trending audio', 'Studying similar accounts', 'Found a new format!'] }
];

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = window.innerWidth < 700;

// ---------- helpers ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261022);
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); f *= 2; a *= 0.5; } return s / 0.9375; }
function ridged(x, z) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 5; i++) { const n = 1 - Math.abs(vnoise(x * f, z * f) * 2 - 1); s += a * n * n; f *= 2.03; a *= 0.5; } return s / 0.97; }
function ss(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
// sRGB hex -> linear colour, for the ACES / sRGB pipeline
const L = (h) => new THREE.Color(h).convertSRGBToLinear();

// ---------- campus layout ----------
const DECK = 0.3, SPA = 0.2;
const PADS = [{ x0: 11, x1: 42, z0: -17, z1: 11 }, { x0: -31, x1: -11, z0: -11, z1: 13 }]; // flattened ground
const SURF = [ // walkable surfaces above the ground
  { x0: -8.2, x1: 8.2, z0: -5.7, z1: 4.7, y: DECK },
  { x0: -2, x1: 2, z0: 4.7, z1: 5.4, y: 0.15 },
  { x0: -29, x1: -12, z0: -9, z1: 7, y: SPA }
];
const NOGRASS = SURF.concat([
  { x0: 15, x1: 25, z0: -16, z1: -7 }, { x0: 27.4, x1: 40.6, z0: -14.8, z1: -7.2 },
  { x0: 22, x1: 38, z0: 2.5, z1: 10 }, { x0: 13, x1: 18, z0: 4.6, z1: 8.4 },
  { x0: -1.1, x1: 1.1, z0: 4.8, z1: 16.5 }
]);
const FIRE = { x: -20, z: 10.5 };
function inRect(r, x, z, m) { m = m || 0; return x > r.x0 - m && x < r.x1 + m && z > r.z0 - m && z < r.z1 + m; }
function offSurf(x, z) { return Math.hypot(x - FIRE.x, z - FIRE.z) > 2.9 && !NOGRASS.some(r => inRect(r, x, z, 0.1)); }
function padMask(x, z) {
  let m = 0;
  for (const p of PADS) { const dx = Math.max(p.x0 - x, 0, x - p.x1), dz = Math.max(p.z0 - z, 0, z - p.z1); m = Math.max(m, 1 - ss(0, 8, Math.hypot(dx, dz))); }
  return m;
}

// ---------- terrain ----------
const HX = 40, HZ = -430; // Sassolungo massif centre
function heroMask(x, z) { return 1 - ss(170, 320, Math.hypot(x - HX, (z - HZ) * 1.4)); }
function baseH(x, z) {
  const d = Math.hypot(x, z + 0.5);
  const near = ss(12, 55, d) * (1 - padMask(x, z));
  let h = (fbm(x * 0.012 + 3, z * 0.012 + 7) - 0.45) * 12 * near
        + Math.sin(x * 0.021 + 1) * Math.cos(z * 0.017) * 2.5 * near
        + ss(60, 300, d) * 14;
  const ring = ss(330, 500, d);
  if (ring > 0) { const r = ridged(x * 0.0065 + 11, z * 0.0065 - 4); h += ring * r * r * 95 * (1 - heroMask(x, z) * 0.9); }
  return h;
}
function groundAt(x, z) { for (const r of SURF) if (inRect(r, x, z)) return r.y; return baseH(x, z); }
const PEAKS = [ // [x, z, height, radius] relative to the massif centre: Sassolungo towers, west to east
  [-100, 10, 70, 34], [-62, 0, 108, 40], [-34, 12, 92, 26], [-10, -6, 99, 30], [16, 10, 82, 26], [38, -2, 72, 24]
];
function massif(lx, lz) {
  let rock = 0;
  for (const [px, pz, H, r] of PEAKS) {
    const d = Math.hypot(lx - px, (lz - pz) * 1.3), p = 1 - d / r;
    if (p > 0) rock = Math.max(rock, H * ss(0, 0.42, p) * (0.72 + 0.28 * p));
  }
  // Sassopiatto: the long tilted slab to the east
  if (lx > 40) {
    const t = Math.min(1, (lx - 50) / 150);
    rock = Math.max(rock, (90 - 62 * t) * ss(0, 10, lx - 48) * ss(0, 9, 24 - lz) * ss(0, 30, lz + 48) * (1 - ss(0.9, 1, t)));
  }
  if (rock > 4) {
    const w = ss(5, 40, rock);
    rock += (ridged(lx * 0.2 + vnoise(lz * 0.05, lx * 0.01) * 3, lz * 0.035) - 0.45) * 10 * w; // vertical gullies
    rock += (vnoise(lx * 0.12, lz * 0.12) - 0.5) * 14 * ss(40, 100, rock);                     // ragged summits
  }
  const sk1 = 1 - Math.hypot(lx / 175, (lz - 4) / 72);
  const sk2 = 1 - Math.hypot((lx - 115) / 120, lz / 62);
  const scree = Math.max(sk1 > 0 ? 36 * Math.pow(sk1, 1.4) : 0, sk2 > 0 ? 26 * Math.pow(sk2, 1.4) : 0) + (vnoise(lx * 0.08, lz * 0.08) - 0.5) * 3;
  return Math.max(rock, scree);
}

// ---------- renderer ----------
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fail">3D (WebGL) could not start on this device. Try another browser.</div>');
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9e4d6, 260, 1500);
const camera = new THREE.PerspectiveCamera(50, 1, 0.3, 4000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.485;
controls.autoRotateSpeed = 0.6;

const VIEWS = {
  vOverview: () => { const t = new THREE.Vector3(5, 1.5, -3), d = Math.max(50, 40 / (Math.tan(THREE.MathUtils.degToRad(25)) * camera.aspect)); return [t.clone().addScaledVector(new THREE.Vector3(0, 0.21, 1).normalize(), d), t]; },
  vOffice: () => { const t = new THREE.Vector3(0, 1.9, -1.8), d = Math.max(14.5, 6.4 / (Math.tan(THREE.MathUtils.degToRad(25)) * camera.aspect)); return [t.clone().addScaledVector(new THREE.Vector3(0, 0.13, 1).normalize(), d), t]; },
  vCourts: () => { const t = new THREE.Vector3(27, 0.5, -3); return [new THREE.Vector3(27, 13, camera.aspect < 1 ? 34 : 20), t]; },
  vLounge: () => { const t = new THREE.Vector3(-20.5, 0.6, 0.5); return [new THREE.Vector3(-13, 8.5, camera.aspect < 1 ? 26 : 16), t]; }
};

// ---------- sky (procedural gradient, sun and cirrus streaks) ----------
const skyU = {
  top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() }, warm: { value: new THREE.Color() },
  sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() }, groundCol: { value: L('#4c5a2e') }, uTime: { value: 0 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: [
    'uniform vec3 top; uniform vec3 bottom; uniform vec3 warm; uniform vec3 sunDir; uniform vec3 sunCol; uniform vec3 groundCol; uniform float uTime; varying vec3 vP;',
    'float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }',
    'float fb(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * n2(p); p *= 2.07; a *= 0.5; } return s; }',
    'void main(){',
    '  vec3 d = normalize(vP); float h = max(d.y, 0.0);',
    '  vec3 c = mix(bottom, top, pow(smoothstep(0.0, 0.65, h), 0.55));',
    '  vec3 sd = normalize(sunDir); float s = max(dot(d, sd), 0.0);',
    '  c = mix(c, warm, pow(s, 2.5) * 0.55 * (1.0 - smoothstep(0.0, 0.5, h)));',
    '  if (d.y > 0.0) {',
    '    vec2 uv = d.xz / (d.y + 0.12);',
    '    vec2 r = vec2(uv.x * 0.8 + uv.y * 0.6, uv.y * 0.8 - uv.x * 0.6);',
    '    float n = fb(vec2(r.x * 0.9 + uTime * 0.004, r.y * 5.5));',
    '    float m = smoothstep(0.56, 0.82, n) * smoothstep(0.03, 0.14, d.y) * (1.0 - smoothstep(0.45, 0.85, d.y));',
    '    c = mix(c, mix(vec3(1.0), warm * 1.15, 0.35 + 0.4 * s), m * 0.55);',
    '  }',
    '  c += sunCol * (pow(s, 900.0) * 6.0 + pow(s, 14.0) * 0.22);',
    '  c = mix(c, groundCol, smoothstep(0.0, -0.12, d.y));',
    '  gl_FragColor = linearToOutputTexel(vec4(c, 1.0));',
    '}'
  ].join('\n')
});
const skyGeo = new THREE.SphereGeometry(1500, 48, 24);
scene.add(new THREE.Mesh(skyGeo, skyMat));
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(skyGeo, skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function updateEnv() {
  const rt = pmrem.fromScene(envScene, 0.02, 1, 3200);
  scene.environment = rt.texture;
  if (envRT) envRT.dispose();
  envRT = rt;
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);

function mergeGeos(geos) {
  const parts = geos.map(g => g.index ? g.toNonIndexed() : g);
  const total = parts.reduce((s, g) => s + g.attributes.position.count, 0);
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
  let o = 0;
  parts.forEach(g => { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  return out;
}

  const crown = mergeGeos([

    new THREE.ConeGeometry(0.24, 0.42, 9).translate(0, 0.52, 0),
    new THREE.ConeGeometry(0.16, 0.36, 9).translate(0, 0.74, 0),
    new THREE.ConeGeometry(0.08, 0.22, 7).translate(0, 0.90, 0)
  ]);
  const N = small ? 2000 : 3200;
  const foliage = new THREE.InstancedMesh(crown, new THREE.MeshStandardMaterial({ color: L('#203b22'), roughness: 0.95, flatShading: true, envMapIntensity: 0.5 }), N);
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.018, 0.03, 0.12, 5).translate(0, 0.06, 0), new THREE.MeshStandardMaterial({ color: L('#4a3322') }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  let k = 0, guard = 0;
  while (k < N && guard++ < 200000) {
    const single = k < 70;
    const a = rnd() * Math.PI * 2, r = single ? 32 + rnd() * 90 : 110 + Math.pow(rnd(), 0.9) * 300;
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (!single && fbm(x * 0.012, z * 0.012) < 0.5) continue;     // clump into forests
    if (heroMask(x, z) > 0.35 || padMask(x, z) > 0) continue;
    if (z < 0 && r < 160 && Math.abs(Math.atan2(x, -z)) < 0.4) continue; // keep the mountain view open
    const h = baseH(x, z);
    if (h > 34 || baseH(x + 3, z) - h > 2.2) continue;              // no trees on rock or steep slopes
    const th = 9 + rnd() * 7, w = th * (0.85 + rnd() * 0.3);
    v.set(x, h - 0.2, z); q.setFromAxisAngle(up, rnd() * 6.28); s.set(w, th, w);
    m.compose(v, q, s); foliage.setMatrixAt(k, m); trunks.setMatrixAt(k, m);
    k++;
  }
  foliage.count = trunks.count = k;
  foliage.castShadow = true;

}

  if (s.type === 'text') {

    }
  } else if (s.type === 'chart') {
    for (let i = 0; i < 9; i++) {

    x.fillStyle = col; x.beginPath(); x.arc(128, 53, 16, 0, 7); x.fill();
    ['#ff8a3d', col, '#2fbf66', '#3d8bff'].forEach((cc, r) => { for (let j = 0; j < 4; j++) { x.fillStyle = cc; x.globalAlpha = 0.85; x.fillRect(14 + j * 58 + hash2(r, j) * 14, 92 + r * 15, 30 + hash2(j, r) * 22, 10); } });
    x.globalAlpha = 1;
    const ph = 14 + ((t * 40) % 228); x.fillStyle = '#fff'; x.fillRect(ph, 88, 2, 66);
  } else if (s.type === 'calendar') {

function updateActs(dt) {

        if (c < 0.45) handPos(s.ball.position, s, 1.38);
        else if (c < 1.35) arc(s.ball.position, handPos(tmpA, s, 1.38), tmpB.set(RIM.x, RIM.y + 0.2, RIM.z), (c - 0.45) / 0.9, 1.6);

// ---------- agent behaviour ----------
const SPEED = 2.4;
const side = (x) => (x >= 0 ? 1 : -1);
const exitPt = (s) => new THREE.Vector3(s * 9.2, 0, -3.5);
function setStatus(ag, text) {
  if (ag.statusText === text) return;
  ag.statusText = text;
  ag.tag.querySelector('span').textContent = text;
  ag.tag.classList.add('pop'); setTimeout(() => ag.tag.classList.remove('pop'), 300);
}
function release(ag) { if (ag.slot) { ag.slot.occ = -1; ag.slot.arrived = false; } ag.slot = null; ag.act = null; }
function startWalk(ag, pts, goal, label) {
  if (ag.state === 'desk') { ag.pos.set(ag.seat.x, 0, ag.seat.z); pts.unshift(ag.behind.clone(), new THREE.Vector3(ag.behind.x, 0, -3.5)); }
  ag.path = pts; ag.goal = goal; ag.state = 'walk';
  setStatus(ag, 'Heading to ' + label);
}
function goDesk(ag) {
  const fromDesk = ag.state === 'desk';
  release(ag);
  const pts = [];
  if (!fromDesk && ag.state !== 'desk') {
    const onDeck = Math.abs(ag.pos.x) < 8.2 && ag.pos.z > -5.7 && ag.pos.z < 4.7;
    if (!onDeck) pts.push(exitPt(side(ag.pos.x)));
    pts.push(new THREE.Vector3(ag.behind.x, 0, -3.5), ag.behind.clone(), new THREE.Vector3(ag.seat.x, 0, ag.seat.z));
  }
  startWalk(ag, pts, 'desk', 'the desk');
}
function pickSlot(ag) {
  const opts = [];
  ACTS.forEach(act => {
    if (act === ag.lastAct) return;
    act.slots.forEach((s, k) => {
      if (s.occ >= 0) return;
      let w = act.kind === 'view' ? 0.15 : 1;
      if (act.kind === 'pair' && act.slots.some(o => o.occ >= 0)) w = 5; // join someone waiting for a partner
      opts.push({ act, s, k, w });
    });
  });
  let r = rnd() * opts.reduce((t, o) => t + o.w, 0);
  for (const o of opts) { r -= o.w; if (r <= 0) return o; }
  return opts[0];
}
function goPlay(ag) {
  const fromDesk = ag.state === 'desk';
  release(ag);
  const o = pickSlot(ag);
  ag.act = o.act; ag.slot = o.s; ag.slotIdx = o.k; o.s.occ = ag.i; o.s.arrived = false; ag.lastAct = o.act;
  const s = side(o.s.walk.x), pts = [];
  if (fromDesk) pts.push(exitPt(s));
  else if (side(ag.pos.x) !== s) pts.push(exitPt(side(ag.pos.x)), exitPt(s));
  pts.push(o.s.walk.clone());
  startWalk(ag, pts, 'act', o.act.where);
}
function placeAt(ag, act, k, t) { // used for the opening layout
  const s = act.slots[k];
  ag.act = act; ag.slot = s; ag.slotIdx = k; s.occ = ag.i; s.arrived = true; ag.lastAct = act;
  ag.pos.copy(s.walk); ag.state = 'act'; ag.actUntil = t + 10 + rnd() * 14;
  setStatus(ag, act.label);
}
function arrive(ag, t) {
  if (ag.goal === 'desk') { ag.state = 'desk'; ag.nextStatus = 0; return; }
  ag.state = 'act'; ag.slot.arrived = true; ag.actUntil = t + 14 + rnd() * 14;
  setStatus(ag, ag.act.label);
}

let workAll = false;
function think(ag, t) {
  const wantDesk = workAll || ag.taskUntil > t;
  if (wantDesk) {
    if (!(ag.state === 'desk' || (ag.state === 'walk' && ag.goal === 'desk'))) goDesk(ag);
    return;
  }
  if (ag.state === 'desk') {
    if (ag.taskUntil && !ag.doneUntil) { ag.doneUntil = t + 2.5; setStatus(ag, 'Task done ✓'); }
    if (!ag.doneUntil || t > ag.doneUntil) { ag.taskUntil = 0; ag.doneUntil = 0; goPlay(ag); }
  } else if (ag.state === 'walk' && ag.goal === 'desk') goPlay(ag);
  else if (ag.state === 'act' && t > ag.actUntil) goPlay(ag);
}

function setFeet(ag, mode) {
  ag.feet.forEach((f, k) => {
    const sx = k ? 1 : -1;
    if (mode === 'sit') f.position.set(sx * 0.14, -0.06, 0.26);
    else if (mode === 'walk') { const s = Math.sin(ag.walkPh + k * Math.PI); f.position.set(sx * 0.14, -0.06 + Math.max(0, s) * 0.06, 0.03 + s * 0.1); }
    else f.position.set(sx * 0.14, -0.06, 0.03);
  });
}
function setArms(ag, x0, z0, x1, z1) { ag.arms[0].rotation.set(x0, 0, z0); ag.arms[1].rotation.set(x1, 0, z1); }
function stand(ag, x, z, yaw) { ag.root.rotation.set(0, yaw, 0); ag.root.position.set(x, groundAt(x, z) + 0.11, z); }
function lie(ag, s, faceDown) {
  const hx = Math.sin(s.head), hz = Math.cos(s.head);
  ag.root.rotation.set(faceDown ? Math.PI / 2 : -Math.PI / 2, faceDown ? Math.atan2(hx, hz) : Math.atan2(-hx, -hz), 0);
  ag.root.position.set(s.p.x - hx * 0.42, s.surf + 0.4, s.p.z - hz * 0.42);
}

function animate(ag, dt, t) {
  const ph = ag.phase, sp = reduceMotion ? 0.3 : 1;
  let eyesClosed = false, lying = false;
  ag.racket.visible = ag.paddle.visible = false;
  ag.zzz.visible = false;
  ag.body.position.y = 0.42; ag.body.rotation.set(0, 0, 0);
  ag.torso.scale.set(0.42, 0.43, 0.4);

  if (ag.state === 'desk') {
    ag.root.rotation.set(0, ag.deskYaw, 0); ag.root.position.copy(ag.seat);
    setFeet(ag, 'sit');
    ag.body.position.y = 0.42 + Math.sin(t * 4 * sp + ph) * 0.012;
    ag.body.rotation.z = Math.sin(t * 0.7 + ph) * 0.05;
    setArms(ag, -1.0 + Math.sin(t * 14 * sp + ph) * 0.12, 0.15, -1.0 + Math.sin(t * 14 * sp + ph + Math.PI) * 0.12, -0.15);
    if (!ag.doneUntil && t > ag.nextStatus) { ag.statusIdx = (ag.statusIdx + 1) % ag.a.status.length; setStatus(ag, ag.a.status[ag.statusIdx]); ag.nextStatus = t + 4.5 + rnd() * 2; }
  } else if (ag.state === 'walk') {
    const tgt = ag.path[0];
    if (tgt) {
      const dx = tgt.x - ag.pos.x, dz = tgt.z - ag.pos.z, d = Math.hypot(dx, dz), step = SPEED * dt;
      if (d <= step) { ag.pos.x = tgt.x; ag.pos.z = tgt.z; ag.path.shift(); }
      else {
        ag.pos.x += dx / d * step; ag.pos.z += dz / d * step;
        let dy = Math.atan2(dx, dz) - ag.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
        ag.yaw += dy * Math.min(1, dt * 10);
      }
    }
    if (!ag.path.length) arrive(ag, t);
    ag.walkPh += dt * 11;
    stand(ag, ag.pos.x, ag.pos.z, ag.yaw);
    setFeet(ag, 'walk');
    ag.body.position.y = 0.42 + Math.abs(Math.sin(ag.walkPh)) * 0.05;
    ag.body.rotation.z = Math.sin(ag.walkPh) * 0.08;
    setArms(ag, Math.sin(ag.walkPh) * 0.6, -0.25, -Math.sin(ag.walkPh) * 0.6, 0.25);
  } else {
    const act = ag.act, s = ag.slot;
    ag.yaw = s.yaw;
    switch (act.kind) {
      case 'hoops': {
        stand(ag, s.p.x, s.p.z, s.yaw); setFeet(ag, 'stand');
        const c = s.clock % 2.6;
        if (c < 0.75) setArms(ag, -2.9, -0.2, -2.9, 0.2); else setArms(ag, -1.3, 0.2, -1.3, -0.2);

        break;
      }
      case 'pair': {
        stand(ag, s.p.x, s.p.z, s.yaw); setFeet(ag, 'stand');
        const w = act.swing[ag.slotIdx];
        if (act.item) {
          ag[act.item].visible = true;
          setArms(ag, 0.1, -0.25, -0.6 - w * 1.3, 0.35 + w * 0.5);
        } else setArms(ag, -1.2 - w * 1.6, 0.2, -1.2 - w * 1.6, -0.2);
        ag.body.position.y = 0.42 + Math.abs(Math.sin(t * 5 + ph)) * 0.03;
        break;
      }
      case 'lie': {
        lying = true; lie(ag, s, act.face === 'down');
        setFeet(ag, 'stand');
        setArms(ag, 0, -0.25, 0, 0.25);
        eyesClosed = true;
        if (act.face === 'down') ag.torso.scale.x = 0.42 + Math.max(0, Math.sin(t * 5 + ph)) * 0.025;
        else {
          ag.torso.scale.z = 0.4 + Math.sin(t * 1.4 + ph) * 0.015;
          ag.zzz.visible = true;
          const q = (t * 0.35 + ph) % 1;
          ag.zzz.position.set(s.p.x, s.surf + 0.9 + q * 0.8, s.p.z);
          ag.zzz.material.opacity = Math.sin(q * Math.PI);
        }
        break;
      }
      case 'tub': {
        ag.root.rotation.set(0, s.yaw, 0);
        ag.root.position.set(s.p.x, TUB.water - 0.38 + Math.sin(t * 1.3 + ph) * 0.02, s.p.z);
        setFeet(ag, 'sit'); setArms(ag, -0.3, -1.25, -0.3, 1.25);
        eyesClosed = Math.sin(t * 0.4 + ph) > 0.3;
        break;
      }
      case 'sit': {
        ag.root.rotation.set(0, s.yaw, 0); ag.root.position.set(s.p.x, s.seat, s.p.z);
        setFeet(ag, 'sit'); setArms(ag, -0.9, 0.15, -0.9, -0.15);
        ag.body.rotation.z = Math.sin(t * 0.9 + ph) * 0.08;
        break;
      }
      default: { // view
        stand(ag, s.p.x, s.p.z, s.yaw); setFeet(ag, 'stand');
        const wave = Math.max(0, Math.sin(t * 0.8 + ph));
        setArms(ag, 0.1, -0.3, -2.6 * wave, 0.3 + wave * 0.4);
        ag.body.rotation.z = Math.sin(t * 0.6 + ph) * 0.06;
      }
    }
  }

  ag.ant.rotation.z = Math.sin(t * 2.2 * sp + ph) * 0.14;
  ag.ant.rotation.x = Math.cos(t * 1.7 * sp + ph) * 0.08;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3 + ph);
  ag.ballMat.emissiveIntensity = 0.9 + pulse * 0.9;
  ag.glow.material.opacity = (0.35 + pulse * 0.35) * (0.7 + dusk * 0.6);

  if (t > ag.nextBlink) { ag.blinkEnd = t + 0.13; ag.nextBlink = t + 2 + rnd() * 4; }

}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

// ---------- light palettes: golden morning (as on Alpe di Siusi) and alpenglow ----------
const DAY = { top: L('#5b8fcc'), bot: '#e8e2d2', warm: L('#ffd9a6'), sun: L('#ffe4bf'), sunI: 3.2, hI: 0.25, hs: L('#bcd3ec'), hg: L('#4b5a2c'),
  dir: new THREE.Vector3(-0.62, 0.36, 0.55).normalize(), mist: L('#ffffff') };
const DUSK = { top: L('#27305e'), bot: '#efa184', warm: L('#ff9566'), sun: L('#ff9c7a'), sunI: 2.4, hI: 0.2, hs: L('#d9a3b0'), hg: L('#3a3350'),
  dir: new THREE.Vector3(0.25, 0.13, 0.96).normalize(), mist: L('#ffc2b0') };
const botDay = new THREE.Color(DAY.bot), botDusk = new THREE.Color(DUSK.bot), tmpV = new THREE.Vector3(), tmpC = new THREE.Color();
function applyLight(m) {
  skyU.top.value.copy(DAY.top).lerp(DUSK.top, m);
  tmpC.copy(botDay).lerp(botDusk, m);
  scene.fog.color.copy(tmpC);                                  // fog is applied after encoding: keep it sRGB
  skyU.bottom.value.copy(tmpC).convertSRGBToLinear();
  skyU.warm.value.copy(DAY.warm).lerp(DUSK.warm, m);
  sun.color.copy(DAY.sun).lerp(DUSK.sun, m);
  sun.intensity = DAY.sunI + (DUSK.sunI - DAY.sunI) * m;
  skyU.sunCol.value.copy(sun.color);
  tmpV.copy(DAY.dir).lerp(DUSK.dir, m).normalize();
  skyU.sunDir.value.copy(tmpV);
  sun.position.copy(sun.target.position).addScaledVector(tmpV, 100);
  hemi.color.copy(DAY.hs).lerp(DUSK.hs, m); hemi.groundColor.copy(DAY.hg).lerp(DUSK.hg, m);
  hemi.intensity = DAY.hI + (DUSK.hI - DAY.hI) * m;
  // grass is unlit in its shader: give it the sun + sky contribution by hand
  grassU.uLight.value.copy(sun.color).multiplyScalar(sun.intensity * 0.42 * (0.4 + tmpV.y)).add(tmpC.copy(skyU.top.value).multiplyScalar(0.9));
  mists.forEach(sp => sp.material.color.copy(DAY.mist).lerp(DUSK.mist, m));
  bulbMat.opacity = 0.25 + 0.75 * m;
}

}
resize();
{ const [p, tg] = VIEWS.vOverview(); camera.position.copy(p); controls.target.copy(tg); controls.update(); }
window.addEventListener('resize', resize);

// ---------- loop ----------
const clock = new THREE.Clock();
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const proj = new THREE.Vector3(), fpos = new THREE.Vector3();
let screenTimer = 0, cardTimer = 0, nextHop = 6;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  grassU.uTime.value = t;
  skyU.uTime.value = t;

  if (Math.abs(duskGoal - dusk) > 0.001) {
    dusk += (duskGoal - dusk) * Math.min(1, dt * 1.6);
    if (Math.abs(duskGoal - dusk) <= 0.001) dusk = duskGoal;
    applyLight(dusk);
    if (Math.abs(dusk - envAt) > 0.12 || dusk === duskGoal) { updateEnv(); envAt = dusk; }
  }

  mists.forEach(sp => { sp.position.x = sp.userData.x0 + Math.sin(t * 0.05 + sp.userData.ph) * 12 + t * sp.userData.drift * 0.1; });
  steam.forEach((s, k) => {
    const q = (t * 0.25 + s.userData.ph) % 1, a = k * 1.1;
    s.position.set(TUB.x + Math.sin(a) * 0.8, TUB.water + 0.1 + q * 1.4, TUB.z + Math.cos(a) * 0.8);
    s.scale.setScalar(0.6 + q * 1.2); s.material.opacity = Math.sin(q * Math.PI) * 0.18;
  });
  flames.forEach((f, k) => {
    const fl = 0.75 + 0.25 * Math.sin(t * 9 + f.userData.ph) * Math.sin(t * 13.7 + k);
    f.position.set(FIRE.x + Math.sin(k * 2.1) * 0.12, 0.35 + k * 0.08 + fl * 0.1, FIRE.z + Math.cos(k * 2.1) * 0.12);
    f.scale.set(0.6 * fl + k * 0.05, (0.9 + k * 0.12) * fl, 1);
    f.material.opacity = 0.75 + dusk * 0.25;
  });

  updateActs(dt);

  screenTimer += dt;
  const redraw = screenTimer > 0.25; if (redraw) screenTimer = 0;

  if (!reduceMotion && t > nextHop) {
    const ag = agents[Math.floor(rnd() * agents.length)];
    if (ag.state === 'desk' || (ag.state === 'act' && ag.act.kind === 'view')) ag.jump = { t: 0, amp: 0.22, spin: false };
    nextHop = t + 5 + rnd() * 6;
  }

  agents.forEach((ag) => {
    think(ag, t);
    animate(ag, dt, t);
    if (redraw) drawScreen(ag.scr, t, ag.state !== 'desk');

    ag.root.updateMatrixWorld();
    ag.ant.localToWorld(proj.set(0, 0.48, 0));
    if (ag.state === 'act' && ag.act.kind === 'lie') proj.set(ag.slot.p.x, ag.slot.surf + 1.0, ag.slot.p.z);
    const dist = proj.distanceTo(camera.position);
    proj.project(camera);
    const visible = proj.z < 1 && Math.abs(proj.x) < 1.1 && Math.abs(proj.y) < 1.1 && dist < 130;
    ag.tag.style.opacity = visible ? (selected < 0 || selected === ag.i ? 1 : 0.35) : 0;
    ag.tag.classList.toggle('far', dist > 30 && selected !== ag.i);
    if (visible) ag.tag.style.transform = 'translate(' + ((proj.x + 1) / 2 * window.innerWidth) + 'px,' + ((1 - proj.y) / 2 * window.innerHeight) + 'px) translate(-50%,-100%)';
  });

  if (flight) {
    const p = Math.min(1, (performance.now() - flight.t0) / 1300), e = ease(p);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0v, flight.t1, e);
    if (p >= 1) flight = null;
  } else if (follow >= 0) { // keep the chosen agent framed as it walks around
    fpos.copy(agents[follow].root.position); fpos.y += 0.5;
    fpos.sub(controls.target).multiplyScalar(Math.min(1, dt * 3));
    controls.target.add(fpos); camera.position.add(fpos);
  }
  controls.update();

  cardTimer += dt;
  if (cardTimer > 0.3) { cardTimer = 0; refreshCard(t); }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
